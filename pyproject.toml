[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-observer"
version = "0.2.0"
description = "Local Windows IPv4 inventory with timestamped discovery evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3", "waitress==3.0.2"]

[project.scripts]
lan-observer = "lan_observer.__main__:main"

[tool.setuptools.packages.find]
include = ["lan_observer*"]

[tool.setuptools.package-data]
lan_observer = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/demo.py" = ["E402"]
