name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements.txt build pip-audit ruff
      - run: python -m ruff check lan_observer tests scripts/demo.py app.py
      - run: python -m ruff format --check lan_observer tests scripts/demo.py app.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip_audit -r requirements.txt
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.python }}
          path: dist/*
